<body>
  <div id="__bundler_placeholder">Loading Hotel Management App...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

kground:#1F5A45;border-color:#1F5A45;color:#F6F1E8}\n.chip-on:hover{background:#174837}\n.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}\n.muted{color:#6B6257}\n.small{font-size:13px}\n.num{font-variant-numeric:tabular-nums}\n.th{display:grid;align-items:center;gap:12px;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6B6257}\n.tr{display:grid;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #EFE7DA;font-size:14px}\n.tr-total{font-weight:700;background:#F9F5EE;border-top:2px solid #E3D9CA}\n.right{text-align:right}\n.scroll{overflow-x:auto}\n.kpi-label{font-size:13px;font-weight:600;color:#6B6257;letter-spacing:.02em}\n.kpi-value{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:32px;line-height:1.1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}\n.navbtn{display:flex;align-items:center;gap:12px;flex:1 1 200px;height:44px;padding:0 14px;border-radius:10px;border:0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}\n.navbtn:hover{background:rgba(246,241,232,.14)}\n.sec-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;letter-spacing:-0.01em;line-height:1.2}\n.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:#1F5A45;cursor:pointer;text-decoration:underline;text-underline-offset:3px}\n.rowbtn{font:inherit;text-align:left;background:none;border:0;padding:0;color:#1F1C17;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9BEAC}\n.rowbtn:hover{color:#1F5A45}\n.tabbtn{font:inherit;font-size:14px;font-weight:600;height:44px;padding:0 4px;border:0;background:none;color:#6B6257;cursor:pointer;border-bottom:2px solid transparent}\n.tabbtn:hover{color:#1F1C17}\n.tab-on{color:#1F5A45;border-bottom-color:#1F5A45}\n.menu-item{display:flex;flex-di }; color: {{nav.pricing.fg}}\" sc-camel-on-click=\"{{nav.pricing.go}}\">\n          <svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13l-7 7-9-9V4h7l9 9z\"><\u002Fpath><circle cx=\"8.5\" cy=\"8.5\" r=\"1.3\"><\u002Fcircle><\u002Fsvg>\n          <span>Room pricing<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{nav.guests.show}}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"navbtn\" style=\"background: {{nav.guests.bg}}; color: {{nav.guests.fg}}\" sc-camel-on-click=\"{{nav.guests.go}}\">\n          <svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><circle cx=\"9\" cy=\"11\" r=\"2\"><\u002Fcircle><path d=\"M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2\"><\u002Fpath><path d=\"M14 10h4\"><\u002Fpath><path d=\"M14 14h4\"><\u002Fpath><\u002Fsvg>\n          <span>Guests &amp; cards<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{nav.bar.show}}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"navbtn\" style=\"background: {{nav.bar.bg}}; color: {{nav.bar.fg}}\" sc-camel-on-click=\"{{nav.bar.go}}\">\n          <svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h14l-7 8z\"><\u002Fpath><path d=\"M12 12v7\"><\u002Fpath><path d=\"M8 21h8\"><\u002Fpath><\u002Fsvg>\n          <span>Bar<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{nav.kitchen.show}}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"navbtn\" style=\"background: n in-sm num\" type=\"number\" min=\"0\" step=\"500\" aria-label=\"Weekday rate for {{r.name}}\" value=\"{{r.weekday}}\" sc-camel-on-change=\"{{r.onWeekday}}\" disabled=\"{{pricingLocked}}\"><\u002Fdiv>\n                    <div><input class=\"in in-sm num\" type=\"number\" min=\"0\" step=\"500\" aria-label=\"Weekend rate for {{r.name}}\" value=\"{{r.weekend}}\" sc-camel-on-change=\"{{r.onWeekend}}\" disabled=\"{{pricingLocked}}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 12px 16px 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; border-top: 1px solid #EFE7DA\">\n              <span class=\"small muted\">{{pricingNote}}<\u002Fspan>\n              <sc-if value=\"{{canPricingEdit}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{saveRates}}\">Save rates<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <h2 class=\"sec-title\">Seasonal rate<\u002Fh2>\n              <button class=\"chip {{season.cls}}\" sc-camel-on-click=\"{{season.toggle}}\" disabled=\"{{pricingLocked}}\">{{season.stateLabel}}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 12px\">\n              <label class=\"lbl\">Season name<input class=\"in\" value=\"{{season.name}}\" sc-camel-on-change=\"{{season.onName}}\" disabled=\"{{pricingLocked}}\"><\u002Flabel>\n              <label class=\"lbl\">From<input class=\"in\" type=\"date\" value=\"{{season.from}}\" sc-camel-on-change=\"{{season.onFrom}}\" disabled=\"{{pricingLocked}}\"><\u002Flabel>\n              <label class=\"lbl\">To<input class=\"in\" type=\"date\" value=\"{{season.to}}\" sc-camel-on-change=\"{{season.onTo}}\" disabled=\"{{pricingLocked}}\"><\u002Flabel>\n              <label class=\"lbl\">Uplift on nightly rate (%)<input class=\"in num\" type=\"number\" min=\"0\" max=\"200\" step=\"5\" value=\"{{season.uplift}}\" sc-camel-on-change=\"{{season.onUplift}}\" disabled=\"{{pricingLocked}}\"><\u002Flabel>\n            <\u002Fdiv>\n            <div class=\"small muted\">{{season.note}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"flex: 1 1 320px; max-width: 460px; padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n          <div>\n            <h2 class=\"sec-title\">Bill calculator<\u002Fh2>\n            <div class=\"small muted\" style=\"margin-top: 4px\">Room charge = nights × the nightly rate for the room type, with weekend and seasonal rates applied per night.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <sc-for list=\"{{calc.types}}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button class=\"chip {{t.cls}}\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px\">\n            <label class=\"lbl\">Check-in<input class=\"in\" type=\"date\" value=\"{{calc.checkIn}}\" sc-camel-on-change=\"{{calc.onCheckIn}}\"><\u002Flabel>\n            <label class=\"lbl\">Nights<input class=\"in num\" type=\"number\" min=\"1\" max=\"30\" value=\"{{calc.nights}}\" sc-camel-on-change=\"{{calc.onNights}}\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; border-top: 1px solid #EFE7DA\">\n            <sc-for list=\"{{calc.lines}}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"dis tn btn-primary\" sc-camel-on-click=\"{{guestCheckout}}\">Check out · view bill<\u002Fbutton><\u002Fsc-if>\n                <button class=\"btn\" sc-camel-on-click=\"{{closeGuest}}\">Close<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 999 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n                <h2 class=\"sec-title\">Charges on this card<\u002Fh2>\n                <div style=\"display: flex; gap: 14px; font-size: 13px; font-weight: 600; flex-wrap: wrap\">\n                  <span>Rooms <span class=\"num\">{{guest.roomTotal}}<\u002Fspan><\u002Fspan>\n                  <span>Bar <span class=\"num\">{{guest.barTotal}}<\u002Fspan><\u002Fspan>\n                  <span>Kitchen <span class=\"num\">{{guest.kitchenTotal}}<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"scroll\">\n                <div style=\"min-width: 520px\">\n                  <div class=\"th\" style=\"grid-template-columns: 130px minmax(200px, 1fr) 110px 130px; padding-left: 0; padding-right: 0\"><div>Date<\u002Fdiv><div>Description<\u002Fdiv><div>Source<\u002Fdiv><div class=\"right\">Amount<\u002Fdiv><\u002Fdiv>\n                  <sc-for list=\"{{guest.lines}}\" as=\"l\" hint-placeholder-count=\"5\">\n                    <div class=\"tr\" style=\"grid-template-columns: 130px minmax(200px, 1fr) 110px 130px; padding-left: 0; padding-right: 0\">\n                      <div class=\"num\">{{l.date}}<\u002Fdiv>\n                      <div style=\"min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{l.desc}}<\u002Fdiv>\n                      <div><span class=\"pill\" style=\"background: {{l.bg}}; color: {{l.fg}}\">{{l.source}}<\u002Fspan><\u002Fdiv>\n                      <div class=\"right num\" style=\"font-weight: 600\">{{l.amount}}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div class=\"tr tr-total\" style=\"grid-template-columns: 130px minmax(200px, 1fr) 110px 130px\"><div><\u002Fdiv><div>Total on card<\u002Fdiv><div><\u002Fdiv><div class=\"right num\">{{guest.total}}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div class=\"card\" style=\"padding: 8px 0 0\">\n          <div style=\"padding: 10px 16px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n            <h2 class=\"sec-title\">{{guestListTitle}}<\u002Fh2>\n            <span class=\"small muted\">Open a guest to see the card and every charge posted to it<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"scroll\">\n            <div style=\"min-width: 900px\">\n              <div class=\"th\" style=\"grid-template-columns: minmax(180px, 1.4fr) 110px 70px 120px 120px 130px 110px 90px\"><div>Guest<\u002Fdiv><div>Card no.<\u002Fdiv><div>Room<\u002Fdiv><div>Check-in<\u002Fdiv><div>Check-out<\u002Fdiv><div class=\"right\">Charges<\u002Fdiv><div>Status<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n              <sc-for list=\"{{guestRows}}\" as=\"g\" hint-placeholder-count=\"6\">\n                <div class=\"tr\" style=\"grid-template-columns: minmax(180px, 1.4fr) 110px 70px 120px 120px 130px 110px 90px\">\n                  <div style=\"min-width: 0\"><div style=\"font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{g.name}}<\u002Fdiv><div class=\"small muted\">{{g.phone}}<\u002Fdiv><\u002Fdiv>\n                  <div class=\"num\">{{g.cardNo}}<\u002Fdiv>\n                  <div class=\"num\" style=\"font-weight: 600\">{{g.roomNo}}<\u002Fdiv>\n                  <div>{{g.checkIn}}<\u002Fdiv>\n                  <div>{{g.checkOut}}<\u002Fdiv>\n                  <di u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{kit.hasError}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err\">{{kit.error}}<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{kit.canCreate}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{kit.place}}\">Send to kitchen<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{kit.locked}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"small muted\">Your role can view the kitchen but not place orders.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{kit.isSales}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 16px\">\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px\">\n              <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Kitchen sales today<\u002Fdiv><div class=\"kpi-value\">{{kit.sales.total}}<\u002Fdiv><\u002Fdiv>\n              <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Orders<\u002Fdiv><div class=\"kpi-value\">{{kit.sales.orders}}<\u002Fdiv><\u002Fdiv>\n              <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Meals sold<\u002Fdiv><div class=\"kpi-value\">{{kit.sales.items}}<\u002Fdiv><\u002Fdiv>\n              <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Charged to cards<\u002Fdiv><div class=\"kpi-value\">{{kit.sales.onCards}}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; align-items: start\">\n              <div class=\"card\" style=\"padding: 8px 0 0\">\n                <div style=\"padding: 10px 16px 6px\"><h2 class=\"sec-title\">Today's kitchen orders<\u002Fh2><\u002Fdiv>\n                <div class=\"scroll\"><div style=\"min-width: 520px\">\n                  <div class=\"th\" style=\"grid-template-columns: 70px minmax(180px, 1fr) 150px 110px\"><div>Time<\u002Fdiv><div>Items<\u002Fdiv><div>Settlement<\u002Fdiv><div class=\"right\">Amount<\u002Fdiv><\u002Fdiv>\n                  <sc-for list=\"{{kit.sales.rows}}\" as=\"o\" hint-placeholder-count=\"6\">\n                    <div class=\"tr\" style=\"grid-template-columns: 70px minmax(180px, 1fr) 150px 110px\"><div class=\"num\">{{o.time}}<\u002Fdiv><div style=\"min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{o.items}}<\u002Fdiv><div><span class=\"pill\" style=\"background: {{o.bg}}; color: {{o.fg}}\">{{o.settle}}<\u002Fspan><\u002Fdiv><div class=\"right num\" style=\"font-weight: 600\">{{o.amount}}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px\">\n                <h2 class=\"sec-title\">Meals sold today<\u002Fh2>\n                <sc-for list=\"{{kit.sales.top}}\" as=\"t\" hint-placeholder-count=\"5\">\n                  <div style=\"display: grid; grid-template-columns: 150px 1fr 60px; align-items: center; gap: 10px; font-size: 14px\"><div style=\"font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{t.name}}<\u002Fdiv><div style=\"height: 14px; background: #F3EDE2; border-radius: 4px; overflow: hidden\"><div style=\"height: 14px; width: {{t.w}}; background: #5B6BC0\"><\u002Fdiv><\u002Fdiv><div class=\"right num\">{{t.qty}}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{kit.isMenu}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card\" style=\"padding: 8px 0 0; max-width: 760px\">\n            <div style=\"padding: 10px 16px 6px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline\"><h2 class=\"sec-title\">Menu &amp; price per meal<\u002Fh2><span class=\"small muted\">{{kit.menuNote}}<\u002Fspan><\u002Fdiv>\n            <div class=\"th\" style=\"grid-template-columns: 1fr 180px\"><div>Meal<\u002Fdiv><div>Price (₦)<\u002Fdiv><\u002Fdiv>\n            <sc-for list=\"{{kit.menuEdit}}\" as=\"m\" hint-placeholder-count=\"8\">\n              <div class=\"tr\" style=\"grid-template-columns: 1fr 180px\"><div style=\"font-weight: 600\">{{m.name}}<\u002Fdiv><div><input class=\"in in-sm num\" type=\"number\" min=\"0\" step=\"100\" aria-label=\"Price of {{m.name}}\" value=\"{{m.price}}\" sc-camel-on-change=\"{{m.onPrice}}\" disabled=\"{{kit.menuLocked}}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{kit.canEditMenu}}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"tr\" style=\"grid-template-columns: 1fr 180px 140px; background: #F9F5EE; border-radius: 0 0 14px 14px\">\n                <input class=\"in in-sm\" placeholder=\"New meal name\" aria-label=\"New meal name\" value=\"{{kit.newName}}\" sc-camel-on-change=\"{{kit.onNewName}}\">\n                <input class=\"in in-sm num\" type=\"number\" min=\"0\" step=\"100\" placeholder=\"Price\" aria-label=\"New meal price\" value=\"{{kit.newPrice}}\" sc-camel-on-change=\"{{kit.onNewPrice}}\">\n                <button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{kit.addItem}}\">Add to menu<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ EXPENSES ============ -->\n    <sc-if value=\"{{isExpenses}}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display: flex; flex-direction: column; gap: 20px\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px\">\n          <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Expenses today<\u002Fdiv><div class=\"kpi-value\">{{exSum.today}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">This month<\u002Fdiv><div class=\"kpi-value\">{{exSum.month}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Recorded this month<\u002Fdiv><div class=\"kpi-value\">{{exSum.count}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\" style=\"padding: 18px 20px\"><div class=\"kpi-label\">Largest category<\u002Fdiv><div class=\"kpi-value\" style=\"font-size: 22px\">{{exSum.topCat}}<\u002Fdiv><div class=\"small muted num\">{{exSum.topAmt}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{canExpensesCreate}}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n            <div><h2 class=\"sec-title\">Record an expense<\u002Fh2><div class=\"small muted\" style=\"margin-top: 4px\">A new expense shows up immediately in the list below, in the expense report and on the dashboard.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px\">\n              <label class=\"lbl\">Date<input class=\"in\" type=\"date\" value=\"{{ex.date}}\" sc-camel-on-change=\"{{ex.onDate}}\"><\u002Flabel>\n              <label class=\"lbl\">Category\n                <sc-raw-select class=\"in\" value=\"{{ex.category}}\" sc-camel-on-change=\"{{ex.onCategory}}\">\n                  <option value=\"Utilities\">Utilities<\u002Foption>\n                  <option value=\"Food &amp; beverage stock\">Food &amp; beverage stock<\u002Foption>\n                  <option value=\"Supplies\">Supplies<\u002Foption>\n                  <option value=\"Maintenance\">Maintenance<\u002Foption>\n                  <option value=\"Salaries\">Salaries<\u002Foption>\n                  <option value=\"Marketing\">Marketing<\u002Foption>\n                  <option value=\"Other\">Other<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label class=\"lbl\" style=\"grid-column: span 2\">Description<input class=\"in\" placeholder=\"e.g. Diesel for generator\" value=\"{{ex.description}}\" sc-camel-on-change=\"{{ex.onDescription}}\"><\u002Flabel>\n              <label class=\"lbl\">Amount (₦)<input class=\"in num\" type=\"number\" min=\"0\" step=\"100\" placeholder=\"0\" value=\"{{ex.amount}}\" sc-camel-on-change=\"{{ex.onAmount}}\"><\u002Flabel>\n              <label class=\"lbl\">Paid to<input class=\"in\" placeholder=\"Supplier or payee\" value=\"{{ex.paidTo}}\" sc-camel-on-change=\"{{ex.onPaidTo}}\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap\">\n              <sc-if value=\"{{ex.hasError}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\">{{ex.error}}<\u002Fspan><\u002Fsc-if>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{addExpense}}\">Record expense<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div class=\"card\" style=\"padding: 8px 0 0\">\n          <div style=\"padding: 10px 16px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n            <h2 class=\"sec-title\">Expense list<\u002Fh2>\n            <span class=\"small muted\">{{exListNote}}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"scroll\">\n            <div style=\"min-width: 860px\">\n              <div class=\"th\" style=\"grid-template-columns: 120px 170px minmax(220px, 2fr) 170px 130px 130px\"><div>Date<\u002Fdiv><div>Category<\u002Fdiv><div>Description<\u002Fdiv><div>Paid to<\u002Fdiv><div>Recorded by<\u002Fdiv><div class=\"right\">Amount<\u002Fdiv><\u002Fdiv>\n              <sc-for list=\"{{expenseRows}}\" as=\"e\" hint-placeholder-count=\"8\">\n                <div class=\"tr\" style=\"grid-template-columns: 120px 170px minmax(220px, 2fr) 170px 130px 130px; background: {{e.bg}}\">\n                  <div class=\"num\">{{e.date}}<\u002Fdiv>\n                  <div><span class=\"pill\" style=\"background: #F3EDE2; color: #5F564B\">{{e.category}}<\u002Fspan><\u002Fdiv>\n                  <div style=\"min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600\">{{e.description}}<\u002Fdiv>\n                  <div class=\"muted\" style=\"min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{e.paidTo}}<\u002Fdiv>\n                  <div class=\"muted\">{{e.by}}<\u002Fdiv>\n                  <div class=\"right num\" style=\"font-weight: 600\">{{e.amount}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ USERS & ROLES ============ -->\n    <sc-if value=\"{{isUsers}}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display: flex; flex-direction: column; gap: 20px\">\n        <div style=\"display: flex; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid #E3D9CA\">\n          <sc-for list=\"{{uTabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button class=\"tabbtn {{t.cls}}\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{uUsers}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n            <div class=\"card\" style=\"flex: 999 1 460px; min-width: 0; padding: 8px 0 0\">\n              <div style=\"padding: 10px 16px 6px\"><h2 class=\"sec-title\">Staff users<\u002Fh2><\u002Fdiv>\n              <div class=\"scroll\"><div style=\"min-width: 560px\">\n                <div class=\"th\" style=\"grid-template-columns: minmax(200px, 1.4fr) 160px 110px 90px\"><div>User<\u002Fdiv><div>Role<\u002Fdiv><div>Status<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{userRows}}\" as=\"u\" hint-placeholder-count=\"5\">\n                  <div class=\"tr\" style=\"grid-template-columns: minmax(200px, 1.4fr) 160px 110px 90px\">\n                    <div style=\"display: flex; align-items: center; gap: 12px; min-width: 0\">\n                      <div aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 50%; background: #E3EEE8; color: #1F4D3B; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0\">{{u.initials}}<\u002Fdiv>\n                      <div style=\"min-width: 0\"><div style=\"font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{u.name}}<\u002Fdiv><div class=\"small muted\" style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{u.email}}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-weight: 600\">{{u.roleName}}<\u002Fdiv>\n                    <div><span class=\"pill\" style=\"background: #DCEBDF; color: #1F5A45\">Active<\u002Fspan><\u002Fdiv>\n                    <div class=\"right\"><sc-if value=\"{{u.isMe}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"small muted\">You<\u002Fspan><\u002Fsc-if><sc-if value=\"{{u.canSwitch}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-sm\" sc-camel-on-click=\"{{u.signIn}}\">Sign in as<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{canUsersCreate}}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"card\" style=\"flex: 1 1 300px; max-width: 400px; padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n                <h2 class=\"sec-title\">Add a staff user<\u002Fh2>\n                <label class=\"lbl\">Full name<input class=\"in\" placeholder=\"Name\" value=\"{{nu.name}}\" sc-camel-on-change=\"{{nu.onName}}\"><\u002Flabel>\n                <label class=\"lbl\">Email<input class=\"in\" type=\"email\" placeholder=\"name@hotel.com\" value=\"{{nu.email}}\" sc-camel-on-change=\"{{nu.onEmail}}\"><\u002Flabel>\n                <div class=\"lbl\">Role<\u002Fdiv>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n                  <sc-for list=\"{{nu.roles}}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <button class=\"chip {{r.cls}}\" sc-camel-on-click=\"{{r.pick}}\">{{r.label}}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{nu.hasError}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err\">{{nu.error}}<\u002Fdiv><\u002Fsc-if>\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{addUser}}\">Add user<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{uRoles}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n            <div style=\"flex: 1 1 260px; max-width: 340px; display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{roleCards}}\" as=\"r\" hint-placeholder-count=\"4\">\n                <button class=\"menu-item\" style=\"min-height: 0; flex-direction: row; justify-content: space-between; align-items: center; border: 2px solid {{r.border}}\" sc-camel-on-click=\"{{r.pick}}\">\n                  <span style=\"font-weight: 600\">{{r.name}}<\u002Fspan>\n                  <span class=\"small muted num\">{{r.userCount}} users<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{canUsersCreate}}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n                  <div class=\"lbl\">Create a role<\u002Fdiv>\n                  <input class=\"in\" placeholder=\"e.g. Accountant\" aria-label=\"New role name\" value=\"{{nr.name}}\" sc-camel-on-change=\"{{nr.onName}}\">\n                  <sc-if value=\"{{nr.hasError}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"err\">{{nr.error}}<\u002Fdiv><\u002Fsc-if>\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{createRole}}\">Create role<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div class=\"card\" style=\"flex: 999 1 460px; min-width: 0; padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap\">\n                <div style=\"flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px\">\n                  <div class=\"kpi-label\">Role name<\u002Fdiv>\n                  <input class=\"in\" style=\"max-width: 320px; font-weight: 600\" aria-label=\"Role name\" value=\"{{role.name}}\" sc-camel-on-change=\"{{role.onName}}\" disabled=\"{{role.nameLocked}}\">\n                  <div class=\"small muted\">{{role.note}}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{role.canDelete}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-danger btn-sm\" sc-camel-on-click=\"{{deleteRole}}\">Delete role<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"scroll\"><div style=\"min-width: 520px\">\n                <div class=\"th\" style=\"grid-template-columns: minmax(160px, 1fr) 90px 90px 90px 90px; padding-left: 0; padding-right: 0\"><div>Module<\u002Fdiv><div style=\"text-align: center\">View<\u002Fdiv><div style=\"text-align: center\">Create<\u002Fdiv><div style=\"text-align: center\">Edit<\u002Fdiv><div style=\"text-align: center\">Delete<\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{role.perms}}\" as=\"p\" hint-placeholder-count=\"9\">\n                  <div class=\"tr\" style=\"grid-template-columns: minmax(160px, 1fr) 90px 90px 90px 90px; padding-left: 0; padding-right: 0\">\n                    <div style=\"font-weight: 600\">{{p.label}}<\u002Fdiv>\n                    <div style=\"text-align: center\"><input class=\"cb\" type=\"checkbox\" aria-label=\"View {{p.label}}\" checked=\"{{p.view}}\" sc-camel-on-change=\"{{p.tView}}\" disabled=\"{{role.locked}}\"><\u002Fdiv>\n                    <div style=\"text-align: center\"><input class=\"cb\" type=\"checkbox\" aria-label=\"Create in {{p.label}}\" checked=\"{{p.create}}\" sc-camel-on-change=\"{{p.tCreate}}\" disabled=\"{{role.locked}}\"><\u002Fdiv>\n                    <div style=\"text-align: center\"><input class=\"cb\" type=\"checkbox\" aria-label=\"Edit in {{p.label}}\" checked=\"{{p.edit}}\" sc-camel-on-change=\"{{p.tEdit}}\" disabled=\"{{role.locked}}\"><\u002Fdiv>\n                    <div style=\"text-align: center\"><input class=\"cb\" type=\"checkbox\" aria-label=\"Delete in {{p.label}}\" checked=\"{{p.delete}}\" sc-camel-on-change=\"{{p.tDelete}}\" disabled=\"{{role.locked}}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv><\u002Fdiv>\n              <div class=\"small muted\">Users with this role see only the modules ticked under View; Create, Edit and Delete control the buttons inside each module. Changes apply immediately — use “Sign in as” on the Users tab to see the result.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isNone}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card\" style=\"padding: 32px; max-width: 560px; display: flex; flex-direction: column; gap: 8px\">\n        <h2 class=\"sec-title\">Nothing to show for this role yet<\u002Fh2>\n        <div class=\"muted\">The role {{me.roleName}} has no modules ticked under View. An administrator can enable modules under Users &amp; roles, or use “Switch user” to sign in as someone else.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{toast.show}}\" hint-placeholder-val=\"{{ false }}\">\n    <div aria-live=\"polite\" style=\"position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1F1C17; color: #F6F1E8; padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.22); z-index: 50; max-width: 90vw\">{{toast.text}}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hotelName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Palmview Hotel &amp; Suites&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1300}}\">\n// ======================================================================\n//  Hotel Management App — clickable demo on static placeholder data.\n//  No API, no database: everything lives in this component's state.\n// ======================================================================\n\nvar TODAY = '2026-10-22';\nvar NOW_TIME = '14:10';\nvar DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\nvar DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\nvar MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\nvar MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];\n\nvar MODULES = [\n  { id: 'dashboard', label: 'Dashboard' },\n  { id: 'reports', label: 'Reports' },\n  { id: 'rooms', label: 'Rooms' },\n  { id: 'pricing', label: 'Room pricing' },\n  { id: 'guests', label: 'Guests & cards' },\n  { id: 'bar', label: 'Bar' },\n  { id: 'kitchen', label: 'Kitchen' },\n  { id: 'expenses', label: 'Expenses' },\n  { id: 'users', label: 'Users & roles' }\n];\nvar ACTIONS = ['view', 'create', 'edit', 'delete'];\n\nvar STATUS = {\n  available: { label: 'Available', bg: '#DCEBDF', fg: '#1F5A45' },\n  occupied: { label: 'Occupied', bg: '#E2E4F3', fg: '#333C7A' },\n  cleaning: { label: 'Cleaning', bg: '#F7E8C3', fg: '#6E4A00' },\n  maintenance: { label: 'Maintenance', bg: '#F5D9CF', fg: '#8A2E14' }\n};\nvar SRC = {\n  rooms: { label: 'Rooms', color: '#2A7F5A', bg: '#DCEBDF', fg: '#1F5A45' },\n  bar: { label: 'Bar', color: '#DB742A', bg: '#FBE3D0', fg: '#8A3F0F' },\n  kitchen: { label: 'Kitchen', color: '#5B6BC0', bg: '#E2E4F3', fg: '#333C7A' }\n};\nvar SETTLE = {\n  card: { label: 'Guest card', bg: '#E2E4F3', fg: '#333C7A' },\n  paid: { label: 'Paid', bg: '#DCEBDF', fg: '#1F5A45' }\n};\nvar EXP_CATS = ['Utilities', 'Food & beverage stock', 'Supplies', 'Maintenance', 'Salaries', 'Marketing', 'Other'];\nvar KITCHEN_FLOW = { queued: 'preparing', preparing: 'ready', ready: 'served' };\nvar KITCHEN_NEXT = { queued: 'Start preparing', preparing: 'Mark ready', ready: 'Mark served' };\n\n// ---------- small helpers ----------\nfunction pad(n) { return (n < 10 ? '0' : '') + n; }\nfunction parseD(d) { var p = String(d).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }\nfunction isoD(ms) { var t = new Date(ms); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }\nfunction addDays(d, n) { return isoD(parseD(d) + n * 86400000); }\nfunction dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }\nfunction dow(d) { return new Date(parseD(d)).getUTCDay(); }\nfunction isWeekend(d) { var w = dow(d); return w === 5 || w === 6; }\nfunction validDate(d) { return /^\\d{4}-\\d{2}-\\d{2}$/.test(d || '') && !isNaN(parseD(d)); }\nfunction fmtD(d) { if (!validDate(d)) return '—'; var t = new Date(parseD(d)); return DOW[t.getUTCDay()] + ' ' + t.getUTCDate() + ' ' + MON[t.getUTCMonth()]; }\nfunction fmtDShort(d) { if (!validDate(d)) return '—'; var t = new Date(parseD(d)); return t.getUTCDate() + ' ' + MON[t.getUTCMonth()]; }\nfunction fmtDLong(d) { var t = new Date(parseD(d)); return DOWL[t.getUTCDay()] + ' ' + t.getUTCDate() + ' ' + MONL[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); }\nfunction money(n) {\n  var v = Math.round(n || 0);\n  var s = Math.abs(v).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  return (v < 0 ? '−' : '') + '₦' + s;\n}\nfunction pctOf(part, total) { return total > 0 ? Math.round(part / total * 100) + '%' : '0%'; }\nfunction initials(name) { return String(name || '').split(/\\s+/).filter(Boolean).slice(0, 2).map(function (s) { return s[0].toUpperCase(); }).join(''); }\nfunction sum(arr, f) { var t = 0; for (var i = 0; i < arr.length; i++) t += f ? f(arr[i]) : arr[i]; return t; }\nfunction byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }\nfunction seqId(prefix, n) { return prefix + (n < 1000 ? ('000' + n).slice(-4) : n); }\nfunction linesText(lines) { return lines.map(function (l) { return l.qty + '× ' + l.name; }).join(', '); }\nfunction emptyPerms() { var p = {}; MODULES.forEach(function (m) { p[m.id] = { view: false, create: false, edit: false, delete: false }; }); return p; }\nfunction permsFrom(spec) {\n  var p = emptyPerms();\n  Object.keys(spec).forEach(function (mod) { spec[mod].forEach(function (a) { p[mod][a] = true; }); });\n  return p;\n}\nfunction clonePerms(p) { var c = {}; Object.keys(p).forEach(function (k) { c[k] = { view: p[k].view, create: p[k].create, edit: p[k].edit, delete: p[k].delete }; }); return c; }\n\n// Nightly rate for a room type on a given night: weekday or weekend rate,\n// lifted by the seasonal uplift when the night falls inside the season.\nfunction rateFor(roomTypes, season, typeId, date) {\n  var t = byId(roomTypes, typeId);\n  if (!t) return 0;\n  var base = isWeekend(date) ? t.weekend : t.weekday;\n  var inSeason = season && season.active && validDate(season.from) && validDate(season.to) && date >= season.from && date <= season.to;\n  var uplift = inSeason ? (parseFloat(season.uplift) || 0) : 0;\n  return Math.round(base * (1 + uplift / 100));\n}\nfunction nightKind(season, date) {\n  var inSeason = season && season.active && validDate(season.from) && validDate(season.to) && date >= season.from && date <= season.to;\n  return (isWeekend(date) ? 'weekend' : 'weekday') + (inSeason ? ' · ' + season.name : '') + ' night';\n}\n\n// ======================================================================\n//  PLACEHOLDER DATA SET — edit here (deliverable D3). Deterministic, so\n//  every reload shows the same hotel.\n// ======================================================================\nfunction makeRng(seed) { var s = seed; return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }\n\nfunction buildSeed() {\n  var rnd = makeRng(20261022);\n  var between = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };\n  var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };\n\n  var roomTypes = [\n    { id: 'standard', name: 'Standard', weekday: 25000, weekend: 30000 },\n    { id: 'deluxe', name: 'Deluxe', weekday: 45000, weekend: 52000 },\n    { id: 'suite', name: 'Suite', weekday: 85000, weekend: 95000 }\n  ];\n  var season = { name: 'Festive season', from: '2026-12-15', to: '2027-01-05', uplift: '15', active: true };\n\n  var rooms = [];\n  ['101', '102', '103', '104', '105', '106'].forEach(function (no) { rooms.push({ no: no, type: 'standard', status: 'available', guestId: null, note: '' }); });\n  ['201', '202', '203', '204', '205', '206'].forEach(function (no) { rooms.push({ no: no, type: 'deluxe', status: 'available', guestId: null, note: '' }); });\n  ['301', '302', '303', '304'].forEach(function (no) { rooms.push({ no: no, type: 'suite', status: 'available', guestId: null, note: '' }); });\n  var roomByNo = function (no) { for (var i = 0; i < rooms.length; i++) if (rooms[i].no === no) return rooms[i]; return null; };\n\n  var barMenu = [\n    { name: 'Star Lager', price: 1500 }, { name: 'Heineken', price: 2000 }, { name: 'Guinness Stout', price: 2000 },\n    { name: 'Smirnoff Ice', price: 1800 }, { name: 'Coca-Cola', price: 800 }, { name: 'Bottled water', price: 500 },\n    { name: 'Chapman', price: 3000 }, { name: 'Orange juice', price: 1500 }, { name: 'Red wine (glass)', price: 4500 },\n    { name: 'Hennessy VS (shot)', price: 6000 }\n  ];\n  var kitchenMenu = [\n    { name: 'Full English breakfast', price: 5500 }, { name: 'Jollof rice & chicken', price: 6500 }, { name: 'Fried rice & beef', price: 6000 },\n    { name: 'Pounded yam & egusi', price: 7500 }, { name: 'Catfish pepper soup', price: 8000 }, { name: 'Grilled fish & plantain', price: 9500 },\n    { name: 'Suya platter', price: 7000 }, { name: 'Club sandwich', price: 4500 }, { name: 'Chicken shawarma', price: 3500 },\n    { name: 'Fruit salad', price: 2500 }\n  ];\n\n  var roles = [\n    { id: 'admin', name: 'Administrator', system: true, perms: permsFrom({ dashboard: ACTIONS, reports: ACTIONS, rooms: ACTIONS, pricing: ACTIONS, guests: ACTIONS, bar: ACTIONS, kitchen: ACTIONS, expenses: ACTIONS, users: ACTIONS }) },\n    { id: 'frontdesk', name: 'Front desk', perms: permsFrom({ dashboard: ['view'], rooms: ['view', 'create', 'edit'], pricing: ['view'], guests: ['view', 'create', 'edit'], bar: ['view'], kitchen: ['view'], expenses: ['view', 'create'] }) },\n    { id: 'bar', name: 'Bar', perms: permsFrom({ bar: ['view', 'create', 'edit'], guests: ['view'] }) },\n    { id: 'kitchen', name: 'Kitchen', perms: permsFrom({ kitchen: ['view', 'create', 'edit'], guests: ['view'] }) }\n  ];\n  var users = [\n    { id: 'u1', name: 'Adaeze Okafor', email: 'adaeze@palmview.example', roleId: 'admin' },\n    { id: 'u2', name: 'Tunde Bakare', email: 'tunde@palmview.example', roleId: 'frontdesk' },\n    { id: 'u3', name: 'Ngozi Eze', email: 'ngozi@palmview.example', roleId: 'bar' },\n    { id: 'u4', name: 'Emeka Nwosu', email: 'emeka@palmview.example', roleId: 'kitchen' },\n    { id: 'u5', name: 'Bola Adeyinka', email: 'bola@palmview.example', roleId: 'frontdesk' }\n  ];\n\n  var seq = { card: 1001, guest: 1, charge: 1, order: 1, expense: 1, user: 6, role: 1, bill: 2041 };\n  var guests = [], roomCharges = [], orders = [], expenses = [];\n\n  function postStay(g) {\n    for (var i = 0; i < g.nights; i++) {\n      var date = addDays(g.checkIn, i);\n      roomCharges.push({ id: 'RC' + (seq.charge++), guestId: g.id, cardNo: g.cardNo, roomNo: g.roomNo, typeId: g.typeId, date: date, amount: rateFor(roomTypes, season, g.typeId, date), kind: nightKind(season, date) });\n    }\n  }\n  function addGuest(name, phone, idType, idNumber, roomNo, checkIn, nights, status) {\n    var room = roomByNo(roomNo);\n    var g = { id: 'G' + (seq.guest++), name: name, phone: phone, idType: idType, idNumber: idNumber, cardNo: 'GC-' + (seq.card++), roomNo: roomNo, typeId: room.type, checkIn: checkIn, nights: nights, status: status, checkedOutOn: status === 'checked-out' ? addDays(checkIn, nights) : null, billNo: status === 'checked-out' ? seqId('BL-', seq.bill++) : null };\n    guests.push(g);\n    postStay(g);\n    if (status === 'in-house') { room.status = 'occupied'; room.guestId = g.id; }\n    return g;\n  }\n\n  // --- history: stays per room from late September to 18 October (all checked out)\n  var histNames = ['Tolu Adebayo', 'Chinedu Obi', 'Fatima Bello', 'Samuel Okafor', 'Blessing Eze', 'Kunle Afolabi', 'Ifeoma Nnaji', 'Musa Garba', 'Precious Udo', 'Bayo Ogunleye', 'Halima Yusuf', 'Emeka Okoye', 'Ronke Alabi', 'Uche Nwankwo', 'Zainab Lawal', 'Femi Ojo', 'Adaora Ike', 'Sadiq Umar', 'Temitope Balogun', 'Nkechi Anyanwu', 'Gbenga Ade', 'Hauwa Sani', 'Obinna Chukwu', 'Kemi Olatunji', 'Peter Edet', 'Aisha Danjuma', 'Rotimi Akande', 'Chiamaka Nwosu', 'Joseph Essien', 'Mariam Sule', 'Dayo Fashola', 'Ngozi Okorie', 'Abdul Rahman', 'Lola Shittu', 'Victor Osagie', 'Amina Kabir', 'Segun Oyelaran', 'Ruth Akpan', 'Ismail Bature', 'Doris Nwafor'];\n  var idTypes = ['National ID (NIN)', \"Driver's licence\", 'International passport', \"Voter's card\"];\n  // --- guests in house today (22 Oct 2026, a Thursday): name, phone, ID type, ID number, room, check-in, nights\n  var inHouseSeed = [\n    ['Chidi Okonkwo', '0803 412 9087', 'National ID (NIN)', '61234509871', '101', '2026-10-20', 3],\n    ['Amaka Nwachukwu', '0805 221 4471', \"Driver's licence\", 'LAG-77821-AA', '102', '2026-10-21', 2],\n    ['Ibrahim Musa', '0701 998 3345', 'National ID (NIN)', '44810932765', '105', '2026-10-19', 4],\n    ['Funke Adeyemi', '0802 775 1120', \"Voter's card\", '90AB45CD12', '201', '2026-10-21', 3],\n    ['David Mensah', '0817 330 6602', 'International passport', 'G0394821', '202', '2026-10-20', 2],\n    ['Grace Okoro', '0806 118 2290', 'National ID (NIN)', '28841973650', '204', '2026-10-22', 1],\n    ['Yusuf Abdullahi', '0703 640 7781', 'National ID (NIN)', '73920184455', '206', '2026-10-18', 5],\n    ['Olumide Bankole', '0809 557 3019', \"Driver's licence\", 'OGN-11940-BK', '301', '2026-10-20', 4],\n    ['Sarah Johnson', '0812 404 8856', 'International passport', 'A1178203', '303', '2026-10-19', 3],\n    ['Ngozi Chukwu', '0810 266 5147', 'National ID (NIN)', '55012398741', '304', '2026-10-22', 2]\n  ];\n  var histEnd = { '106': '2026-10-20' };\n  inHouseSeed.forEach(function (g) { histEnd[g[4]] = g[5]; });\n\n  // history: earlier stays per room, each ending before that room's current guest arrived\n  var nameIdx = 0;\n  rooms.forEach(function (room) {\n    var limit = histEnd[room.no] || TODAY, cursor = '2026-09-26';\n    fo
